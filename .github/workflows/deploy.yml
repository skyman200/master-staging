# 공개 화면 배포(GitHub Actions → Pages). 이 파일은 비공개 소스 skyman200/master-src 의 .github-public/deploy.yml 에서 복사된다.
# - main 에 화면이 올라오면(push) 가장 최근 공개 데이터 초안과 함께 배포한다.
# - 2호기가 승인·비공개를 반영하려고 부를 때(workflow_dispatch, release_id)도 같은 길로 배포한다.
# 캡처·공개 데이터는 git 에 들어가지 않는다(초안 릴리스 첨부 파일 → Pages 산출물). 배포 뒤 산출물과 오래된 초안은 지운다.
name: deploy

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 공개 데이터 초안 릴리스 id (비우면 가장 최근 초안)
        required: false
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: prep
        name: 화면과 공개 데이터 모으기
        run: node .github/deploy/assemble.mjs prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: 산출물과 오래된 초안 지우기
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" || echo "산출물을 지우지 못했습니다(하루 뒤 저절로 지워집니다)."
          node .github/deploy/assemble.mjs cleanup "${DATA_TS}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          DATA_TS: ${{ steps.prep.outputs.ts }}
